<!DOCTYPE html>
<html class="text-[12px] md:text-[14px] lg:text-[16px]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/all.min.css" rel="stylesheet" />
    <link href="./css/fontawesome.min.css" rel="stylesheet" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="container relative sm:py-3 flex justify-between">
      <div
        class="py-3 sm:p-0 bg-white relative bg-secondary flex justify-between flex-1 items-center z-20"
      >
        <a href="#" class="text-primary font-bold text-3xl">Carex</a>
        <span
          id="burger-menu"
          class="sm:hidden cursor-pointer text-based text-3xl"
          ><i class="fa-solid fa-bars"></i>
        </span>
      </div>

      <ul
        id="menu"
        class="flex shadow-md sm:shadow-none flex-col sm:flex-row absolute sm:static bg-secondary w-11/12 sm:w-fit left-1/2 -translate-x-1/2 sm:-translate-x-0 z-10 -top-[500%] py-4 sm:py-0 rounded-b-lg sm:rounded-none items-center sm:gap-12 text-based transition-all duration-500 text-lg font-semibold"
      >
        <li
          class="w-full block text-center py-3 sm:p-0 sm:w-fit sm:pb-1 transition-all duration-300 text-primary border-b sm:border-b-2 border-primary hover:text-primary hover:border-primary"
        >
          <a href="#">Home</a>
        </li>
        <li
          class="w-full block text-center py-3 sm:p-0 sm:w-fit sm:pb-1 transition-all duration-300 border-b sm:border-b-2 border-primary sm:border-transparent hover:text-primary hover:border-primary"
        >
          <a href="#">Vehicles</a>
        </li>
        <li
          class="w-full block text-center py-3 sm:p-0 sm:w-fit sm:pb-1 transition-all duration-300 border-b sm:border-b-2 border-primary sm:border-transparent hover:text-primary hover:border-primary"
        >
          <a href="#">Reservations</a>
        </li>
        <li
          class="cursor-pointer mt-5 sm:m-0 pb-1 transition-all duration-300 bg-primary text-white px-2 rounded-lg"
        >
          Logout
        </li>
      </ul>
    </nav>
  </body>

  <script>
    const burgerMenu = document.getElementById("burger-menu");
    const menu = document.getElementById("menu");
    burgerMenu.onclick = () => {
      menu.classList.toggle("-top-[500%]");
      menu.classList.toggle("top-full");
      burgerMenu.classList.toggle("text-primary");
      burgerMenu.classList.toggle("text-based");
    };
  </script>
</html>
